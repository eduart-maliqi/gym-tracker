name: kreatin-erinnerung

on:
  schedule:
    # UTC; remind.mjs filtert selbst auf 18/21 Uhr Berlin (Sommer-/Winterzeit)
    - cron: "0 16,17,19,20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Uhrzeit-Check überspringen (Test)"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web-push in einem leeren Ordner installieren, damit nicht alle
      # App-Dependencies aus package.json mitinstalliert werden
      - name: Send reminder
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          mkdir -p /tmp/push
          cp scripts/remind.mjs /tmp/push/
          cd /tmp/push
          npm init -y > /dev/null
          npm install --no-audit --no-fund web-push@3
          node remind.mjs
